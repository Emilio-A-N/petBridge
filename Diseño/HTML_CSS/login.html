<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - PetBridge</title>
    <link rel="stylesheet" href="diseño.css">
</head>
<body class="body-login">

<header id="header">
    <div id="logo">
        <a href="inicio.html">
            <img src="/Planning/Logotipo/logo.png" alt="Petbridge Logo">
        </a>
    </div>

    <nav id="panel">
        <a href="portalAdoptante.html" class="textPanel">Adopta</a>
        <a href="portalProtectora.html" class="textPanel">Protectoras</a>
        <a href="portalColaborador.html" class="textPanel">Colabora</a>
        <a href="#" class="textPanel">Calculadora</a>
    </nav>

<div id="panel2">
    <div id="visitante-links">
        <a href="login.html" class="textPanel2">Iniciar sesión</a>
        <a href="registro.html" class="textPanel2">Registro</a>
    </div>

    <div id="usuario-logueado" style="display: none; align-items: center; gap: 10px;">
        <span id="saludo-usuario"></span>
        <a href="#" id="link-mi-panel" class="textPanel2">Mi Panel</a>
        <button onclick="cerrarSesion()" class="boton-salir">Salir</button>
    </div>
</div>
</header>
<button type="button" class="botonCaja" onclick="loginSimulado('Satoru', 'protectora')">Entrar como Protectora</button>

<button type="button" class="botonCaja" style="margin-top:10px; background:#aaa;" 
onclick="loginSimulado('Adoptante Pro', 'adoptante')">Entrar como Adoptante</button>

<main class="contenedor-login">
    <div class="caja-login">
        <div class="login-header">
            <div class="icono-cerradura">🔒</div>
            <h1>Bienvenido de nuevo</h1>
            <p>Introduce tus datos para acceder a PetBridge</p>
        </div>

        <form action="#" class="formulario-login">
            <div class="campo">
                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" placeholder="Ej: GojoSatoru" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="opciones-extra">
                <a href="#" class="link-olvido">¿Has olvidado la contraseña?</a>
            </div>

            <button type="submit" class="botonCaja">Entrar</button>
        </form>

        <div class="login-footer">
            <p>¿Aún no tienes cuenta? <a href="#">Regístrate aquí</a></p>
        </div>
    </div>
</main>
<script src="main.js"></script>

</body>
</html>
